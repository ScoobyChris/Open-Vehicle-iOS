name: iOS build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Xcode
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build for iOS Simulator
        working-directory: OpenVehicleApp
        run: |
          set -o pipefail
          xcodebuild \
            -project "Open Vehicle.xcodeproj" \
            -target "Open Vehicle" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/Build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Launch app and capture screenshot
        run: |
          set -euo pipefail

          device_id="$(
            xcrun simctl list devices available --json |
              jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid'
          )"

          if [[ -z "$device_id" || "$device_id" == "null" ]]; then
            echo "No available iPhone simulator was found" >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Screenshots"
          echo "Using simulator: $(xcrun simctl list devices | grep "$device_id")"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b &
          boot_pid=$!
          for _ in {1..90}; do
            boot_state="$(ps -p "$boot_pid" -o state= 2>/dev/null || true)"
            if [[ -z "$boot_state" || "$boot_state" == Z* ]]; then
              break
            fi
            sleep 2
          done
          boot_state="$(ps -p "$boot_pid" -o state= 2>/dev/null || true)"
          if [[ -n "$boot_state" && "$boot_state" != Z* ]]; then
            kill "$boot_pid" 2>/dev/null || true
            echo "Simulator did not finish booting within three minutes" >&2
            exit 1
          fi
          wait "$boot_pid"
          xcrun simctl status_bar "$device_id" override \
            --time 09:41 \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4
          xcrun simctl install "$device_id" "$RUNNER_TEMP/Build/Open Vehicle.app"
          screen_names=(status car location messages settings)
          for tab_index in "${!screen_names[@]}"; do
            screen_name="${screen_names[$tab_index]}"
            xcrun simctl terminate "$device_id" com.openvehicles.ovms 2>/dev/null || true
            launch_result="$(
              SIMCTL_CHILD_OVMS_SCREENSHOT_TAB="$tab_index" \
                xcrun simctl launch "$device_id" com.openvehicles.ovms
            )"
            echo "$launch_result"
            app_pid="${launch_result##*: }"
            sleep 3

            if ! xcrun simctl spawn "$device_id" /bin/kill -0 "$app_pid"; then
              echo "The app stopped while capturing the $screen_name tab" >&2
              exit 1
            fi

            xcrun simctl io "$device_id" screenshot \
              "$RUNNER_TEMP/Screenshots/$screen_name.png"
          done

          interaction_scenarios=(charging charging-start-confirmation charging-stop-confirmation charging-settings climate climate-start-confirmation climate-stop-confirmation energy)
          for scenario in "${interaction_scenarios[@]}"; do
            xcrun simctl terminate "$device_id" com.openvehicles.ovms 2>/dev/null || true
            launch_result="$(
              SIMCTL_CHILD_OVMS_SCREENSHOT_TAB=0 \
              SIMCTL_CHILD_OVMS_SCREENSHOT_SCENARIO="$scenario" \
                xcrun simctl launch "$device_id" com.openvehicles.ovms
            )"
            echo "$launch_result"
            app_pid="${launch_result##*: }"
            sleep 4

            if ! xcrun simctl spawn "$device_id" /bin/kill -0 "$app_pid"; then
              echo "The app stopped while capturing $scenario" >&2
              exit 1
            fi

            xcrun simctl io "$device_id" screenshot \
              "$RUNNER_TEMP/Screenshots/$scenario.png"
          done

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v5
        with:
          name: ovms-simulator-screenshots
          path: ${{ runner.temp }}/Screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
